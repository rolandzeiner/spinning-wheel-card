name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          # plugin = Lovelace frontend resource (this repo).
          # Use 'integration' for HA Python integrations.
          category: plugin

  build:
    # A stray backtick inside a Lit css/html template is caught by `vp check`
    # below: its type-check reports the syntax error or unknown property that
    # follows. Don't copy in the Perl backtick guard from the sibling repos;
    # it ends each template at the first unescaped backtick, which is the
    # stray one, so it can never fire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        # Installs the vp CLI, Node 24 (pinned below; drop node-version to
        # follow devEngines.runtime) and the npm devEngines asks for, and
        # caches npm's cache. Install runs as its own step below so the
        # lockfile is enforced explicitly.
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Audit production deps
        # --omit=dev keeps the gate enforceable; without it build-tooling
        # advisories (which never ship to users) flood the report.
        run: npm audit --omit=dev --audit-level=high

      - name: Format, lint and type-check (strict)
        # `vp check` = Oxfmt + Oxlint + tsgolint type-check (typeCheck in
        # vite.config.ts). The ONLY type-check in the pipeline: the build
        # transpiles without type-checking, so without this step a type
        # error would sail straight into a green build. Keep it ahead of
        # the build.
        run: vp check

      - name: Test
        # vitest unit suite — runs against the TypeScript sources
        # directly, independent of the built bundle.
        run: vp test run

      - name: Build bundle
        run: vp build

      - name: Assert the committed bundle matches a fresh build
        # The build above regenerates dist/ from src/. Any diff means the
        # committed bundle is stale — someone changed src/ and didn't
        # rebuild. Nothing else in the gate catches it: `vp check` and the
        # tests both run against the TypeScript sources and never look at
        # the built artefact.
        #
        # This repo ships dist/ to HACS users directly, so a stale bundle
        # means every install runs code that no longer matches src/ —
        # invisible in review, and the next build silently "fixes" it
        # without anyone learning what shipped.
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::Committed card bundle differs from a fresh build."
            echo "::error::Run 'vp build' (or 'npm run build') and commit dist/."
            exit 1
          fi

      - name: Syntax-check bundle
        # `node -c` parses without executing — cheapest check that the
        # build didn't produce malformed JS.
        run: node -c dist/spinning-wheel-card.js
